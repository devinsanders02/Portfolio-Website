<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work | Devin Sanders</title>
  
  <!-- Favicon & Touch Icon -->
  <link rel="icon" type="image/png" href="LogoBlue.png">
  <link rel="apple-touch-icon" href="LogoBlue.png">

  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    .work-hero {
      max-width: 1200px;
      margin: 0 auto;
      padding: 9rem 1.5rem 2rem;
    }
    @media (min-width: 768px) {
      .work-hero { padding: 10rem 3rem 3rem; }
    }
    .work-title {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.03em;
      color: var(--text-dark);
      margin-top: 1rem;
    }

    /* 2-Column Work Grid */
    .projects-archive-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 3rem;
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem 6rem;
    }
    @media (min-width: 768px) {
      .projects-archive-grid {
        grid-template-columns: 1fr 1fr;
        gap: 3.5rem 2.5rem;
        padding: 2rem 3rem 8rem;
      }
    }

    .archive-card {
      display: block;
      text-decoration: none;
      color: inherit;
    }
    .archive-thumb-box {
      width: 100%;
      aspect-ratio: 16 / 10;
      border-radius: 6px;
      overflow: hidden;
      background-color: #E2E8F0;
      margin-bottom: 1.25rem;
    }
    .archive-thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }
    .archive-card:hover .archive-thumb-box img {
      transform: scale(1.03);
    }
    .archive-card-title {
      font-weight: 800;
      font-size: 1.35rem;
      color: var(--text-dark);
      letter-spacing: -0.01em;
    }
    .archive-card-meta {
      font-weight: 300;
      font-size: 0.85rem;
      color: #2C3E5080;
      margin-top: 0.25rem;
    }
  </style>
</head>
<body style="background-color: #F4F5F7; color: #2C3E50; font-family: 'Barlow', sans-serif;">

  <!-- Site Preloader -->
  <div id="site-loader">
    <img src="LogoBlue.png" alt="Loading..." class="loader-mark-pulse">
  </div>

  <!-- Slide-Down Top-Third Index Overlay Panel -->
  <div id="index-overlay" class="index-overlay-panel">
    <div class="overlay-top-bar">
      <span style="font-size: 0.75rem; font-weight: 300; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.6);">Index</span>
      <button id="close-overlay-btn" style="background: none; border: none; cursor: pointer; color: white; display: flex; align-items: center;" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="4" y1="4" x2="20" y2="20"></line>
          <line x1="20" y1="4" x2="4" y2="20"></line>
        </svg>
      </button>
    </div>
    <nav class="overlay-nav-links">
      <div class="overlay-link-item">
        <span>01</span>
        <a href="work.html" class="overlay-link" style="color: #F15B22;">Work</a>
      </div>
      <div class="overlay-link-item">
        <span>02</span>
        <a href="ui-ux.html" class="overlay-link">UI/UX Work</a>
      </div>
      <div class="overlay-link-item">
        <span>03</span>
        <a href="about.html" class="overlay-link">About</a>
      </div>
      <div class="overlay-link-item">
        <span>04</span>
        <button id="overlay-contact-link" class="overlay-link">Contact</button>
      </div>
    </nav>
  </div>

  <!-- Floating Orange Peak Nav Button -->
  <button id="floating-nav-btn" class="floating-peak-btn" aria-label="Open Navigation">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
      <path d="M2 14 L6.5 5 L10 10 L16 4" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>

  <!-- Sticky Morphing Logo Header -->
  <nav class="sticky-brand-nav">
    <a href="index.html" class="brand-morph-link" aria-label="Devin Sanders Home">
      <div class="morph-logo-box">
        <img src="LogoLong.png" alt="Devin Sanders" class="logo-full">
        <img src="LogoBlue.png" alt="Devin Sanders Mark" class="logo-mark">
      </div>
    </a>
    <div style="pointer-events: auto; display: flex; gap: 1.5rem; align-items: center;">
      <a href="work.html" style="color: #F15B22; text-decoration: none; font-size: 0.875rem; font-weight: 700;">Work</a>
      <a href="ui-ux.html" style="color: #2C3E50; text-decoration: none; font-size: 0.875rem; font-weight: 500; opacity: 0.85; transition: opacity 0.2s;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.85'">UI/UX</a>
      <a href="about.html" style="color: #2C3E50; text-decoration: none; font-size: 0.875rem; font-weight: 500; opacity: 0.85; transition: opacity 0.2s;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.85'">About</a>
    </div>
  </nav>

  <!-- Work Hero -->
  <section class="work-hero">
    <span class="uppercase-label">Portfolio</span>
    <h1 class="work-title">Selected Projects</h1>
  </section>

  <!-- Grid of All Projects (rendered via main.js) -->
  <main id="work-grid" class="projects-archive-grid"></main>

  <!-- Dark Footer -->
  <footer id="contact" class="site-footer">
    <div class="footer-max-width">
      <span class="uppercase-label">Get in Touch</span>
      <h2 class="footer-heading">Let's build<br>something meaningful.</h2>

      <div>
        <a href="mailto:devin.sanders02@gmail.com" class="footer-link">devin.sanders02@gmail.com</a>
      </div>

      <div style="display: flex; gap: 1.5rem; margin-top: 1.25rem;">
        <a href="https://www.linkedin.com/in/devin-sanders-6a43a41b6/" target="_blank" rel="noopener noreferrer" class="footer-link" style="color: rgba(255,255,255,0.5);">LinkedIn</a>
        <a href="https://www.behance.net/devinsanders" target="_blank" rel="noopener noreferrer" class="footer-link" style="color: rgba(255,255,255,0.5);">Behance</a>
      </div>

      <hr class="footer-divider">

      <div class="footer-sub-row">
        <div style="display: flex; gap: 1.5rem;">
          <a href="work.html" class="footer-link" style="color: rgba(255,255,255,0.5);">Work</a>
          <a href="ui-ux.html" class="footer-link" style="color: rgba(255,255,255,0.5);">UI/UX</a>
          <a href="about.html" class="footer-link" style="color: rgba(255,255,255,0.5);">About</a>
        </div>
        <p style="font-weight: 300; font-size: 0.75rem; color: rgba(255,255,255,0.3);">
          © <span id="copyright-year">2026</span> Devin Sanders. Crafted with intention.
        </p>
      </div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
